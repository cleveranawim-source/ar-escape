<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d16">
<title>AR 방탈출 — 제작 스튜디오</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="app-bg">

<header class="topbar">
  <a class="brand" href="index.html" style="color:inherit;text-decoration:none">
    <span class="dot"></span> AR 방탈출 <span class="badge gray">제작 스튜디오</span>
  </a>
  <div class="row">
    <a class="btn btn-sm btn-ghost" href="lab.html">🔬 실물 테스트</a>
    <a class="btn btn-sm btn-ghost" href="markers.html">🖨 마커 만들기</a>
    <button class="btn btn-sm" id="btn-import">📥 가져오기</button>
    <button class="btn btn-sm btn-primary" id="btn-new">+ 새 방탈출</button>
  </div>
</header>

<main class="studio">
  <div class="layout">
    <!-- 사이드바 -->
    <aside class="side">
      <div class="card" style="padding:16px">
        <div class="card-hd">
          <h3 style="font-size:14px;margin:0">내 방탈출</h3>
          <span class="tiny dim" id="sc-count"></span>
        </div>
        <div class="sc-list" id="sc-list"></div>
      </div>
      <p class="tiny dim" style="margin-top:12px;line-height:1.6">
        데이터는 이 브라우저에만 저장됩니다.<br>
        다른 기기로 옮기려면 <b>내보내기</b>를 쓰세요.
      </p>
    </aside>

    <!-- 편집 영역 -->
    <section id="editor"></section>
  </div>
</main>

<div id="toast-host"></div>
<script type="module" src="js/admin.js"></script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
